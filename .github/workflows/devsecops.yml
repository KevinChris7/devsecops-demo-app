name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-demo-app

jobs:
  security:
    name: Secure Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks_8.30.0_linux_x64.tar.gz
          gitleaks version

      - name: Gitleaks Secret Gate
        run: gitleaks git -v --redact --exit-code 1 .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_app.py

      - name: Install Snyk CLI
        run: |
          curl --compressed https://downloads.snyk.io/cli/stable/snyk-linux -o snyk
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk
          snyk --version

      - name: Snyk Dependency Gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --command=python3 --severity-threshold=high

      - name: Build Docker image
        run: docker build --pull -t ${IMAGE_NAME}:${{ github.sha }} .

      - name: Verify non-root container
        run: docker run --rm ${IMAGE_NAME}:${{ github.sha }} id -u | grep -vq "^0$"

      - name: Trivy Image Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devsecops-demo-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start application container
        run: docker run -d --name devsecops-demo-app -p 5000:5000 ${IMAGE_NAME}:${{ github.sha }}

      - name: Verify application
        run: |
          sleep 5
          curl -f http://localhost:5000/health

      - name: Cleanup container
        if: always()
        run: docker rm -f devsecops-demo-app || true
